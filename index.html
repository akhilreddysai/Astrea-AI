<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Astrea Co-operative Forecast Desk - load and distributed generation forecasting for Socorro Electric Cooperative.">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light"><title>Astrea Co-op Forecast Desk</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap');

/* ============================================================
   ASTREA · ERCOT DESK — light theme
   Palette lifted verbatim from the Nuvve POC (energy-poc.camereye.ai)
   ============================================================ */
:root{
  --green:#759840; --green-dk:#5F7D33; --green-lt:#ABCA47;
  --lime:#CDDC38;  --lime-soft:#E8F0C4; --cyan:#73CEE5; --cyan-dk:#1C7C97;
  --bg:#F2F1EF; --bg-tint:#E8F0D4; --card:#FFFFFF; --well:#F8F9F4; --well-2:#EFF3E6;
  --ink:#111111; --ink-2:#333333; --ink-3:#555555; --ink-4:#767676; --ink-5:#9AA394;
  --line:#D8DFCB; --line-2:rgba(117,152,64,.30); --rule:#CDDC38;
  --pos:#4A7C1F; --pos-bg:#EDF5DF;
  --neg:#C23B2E; --neg-bg:#FBEBE9;
  --warn:#9C6F06; --warn-bg:#FBF2DC;
  --info:#1C7C97; --info-bg:#E4F2F7;
  --mag:#7B4FA0; --mag-bg:#F1EAF8;
  --ff-d:'Merriweather',Georgia,serif;
  --ff-u:'Montserrat',system-ui,sans-serif;
  --ff-m:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:4px;
  --sh:3px 3px 0 rgba(171,202,71,.40);
  --sh-lime:6px 6px 0 var(--lime);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    repeating-linear-gradient(-45deg,transparent,transparent 10px,rgba(117,152,64,.03) 10px,rgba(117,152,64,.03) 11px),
    linear-gradient(165deg,#ffffff 0%,#F2F1EF 55%,#E8F0D4 100%);
  background-attachment:fixed;
  color:var(--ink); font-family:var(--ff-u); font-size:13px; line-height:1.45;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(117,152,64,.35);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--green)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* Very short viewports: give up the fixed shell and let the page scroll. */
@media (max-height:560px){
  body{overflow:auto}
  .app{height:auto;min-height:100vh;grid-template-rows:auto;overflow:visible}
  .main{overflow:visible}
  .canvas{overflow:visible}
  .rail{position:sticky;top:0;height:100vh}
}

/* ---------- primitives ---------- */
h1,h2,h3{font-family:var(--ff-d);color:var(--green);margin:0}
.kicker{font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;font-weight:700;color:var(--green);margin:0}
.sect{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--green);
  border-bottom:2px solid var(--rule);padding-bottom:5px;margin:0 0 12px;display:flex;gap:8px;
  justify-content:space-between;align-items:center}
.sect .r{font-weight:600;letter-spacing:.05em;color:var(--ink-4);text-transform:none;font-size:10px}
.mono{font-family:var(--ff-m)}
.num{font-family:var(--ff-d);font-weight:700;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-4)} .tiny{font-size:10.5px}
hr.hair{height:1px;background:var(--line);border:0;margin:12px 0}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;padding:3px 7px;border-radius:2px;border:1px solid var(--line-2);
  color:var(--ink-2);background:#fff;white-space:nowrap}
.pill.lime{background:var(--lime);color:#111;border-color:var(--lime)}
.pill.ok{background:var(--pos-bg);border-color:#A9C97F;color:var(--pos)}
.pill.bad{background:var(--neg-bg);border-color:#E3A9A2;color:var(--neg)}
.pill.warn{background:var(--warn-bg);border-color:#DEC082;color:var(--warn)}
.pill.info{background:var(--info-bg);border-color:#97CBDC;color:var(--info)}
.pill.mag{background:var(--mag-bg);border-color:#C2A8DA;color:var(--mag)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--pos);display:inline-block;flex:none}
.dot.live{animation:pulse 2s ease-in-out infinite}
.dot.w{background:var(--warn)} .dot.b{background:var(--neg)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  background:#fff;border:1px solid var(--line-2);color:var(--ink);border-radius:var(--r);
  padding:6px 11px;font-size:11px;font-weight:600;transition:.12s;white-space:nowrap}
.btn:hover{background:var(--well-2);border-color:var(--green)}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.pri:hover{background:var(--green-lt);border-color:var(--green-lt);color:#111}
.btn.cta{background:var(--lime);border-color:var(--lime);color:#111;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;font-size:10px}
.btn.cta:hover{background:var(--green-lt)}
.btn.sm{padding:4px 8px;font-size:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.card{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.card.hi{border:2px solid var(--green);box-shadow:var(--sh-lime)}
.grid{display:grid;gap:12px}

table.tbl{width:100%;min-width:100%;border-collapse:collapse;font-size:11.5px}
table.tbl th{text-align:left;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;padding:7px 9px;border-bottom:2px solid var(--rule);background:var(--well-2);white-space:nowrap}
table.tbl td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
table.tbl tbody tr:hover{background:var(--well)}
table.tbl td.r,table.tbl th.r{text-align:right;font-family:var(--ff-m);font-variant-numeric:tabular-nums}
table.tbl th.r{font-family:var(--ff-u)}
.tblwrap{overflow-x:auto;max-width:100%}
.tblwrap::-webkit-scrollbar{height:7px}

/* ============================================================
   SHELL
   ============================================================ */
.app{display:grid;grid-template-columns:218px 1fr;grid-template-rows:100%;
  height:100vh;height:100dvh;width:100vw;overflow:hidden}

.rail{background:linear-gradient(180deg,#5F7D33 0%,#759840 45%,#6A8A36 100%);
  border-right:4px solid var(--lime);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.rail-brand{padding:14px;border-bottom:1px solid rgba(205,220,56,.35)}
.logobox{background:#fff;border:2px solid var(--lime);border-radius:var(--r);padding:8px 10px;
  box-shadow:2px 2px 0 rgba(0,0,0,.12)}
.logobox .lg{font-family:var(--ff-d);font-weight:900;font-size:17px;letter-spacing:.15em;color:var(--green);margin:0}
.logobox .sb{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);margin:2px 0 0;font-weight:700}
.rail-brand .iso{margin:9px 0 0;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#fff;font-weight:700;opacity:.9}
.rail-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding:11px 10px 8px}
.navgrp{font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--lime);font-weight:700;margin:14px 4px 6px;opacity:.95}
.navgrp:first-child{margin-top:2px}
.nav{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:var(--r);cursor:pointer;
  color:#fff;font-size:11.5px;font-weight:600;margin-bottom:4px;border:1px solid rgba(255,255,255,.28);
  background:rgba(0,0,0,.18);transition:.12s}
.nav:hover{background:rgba(0,0,0,.32);border-color:var(--lime)}
.nav.on{background:var(--lime);color:#111;font-weight:700;border-color:var(--lime);box-shadow:2px 2px 0 rgba(0,0,0,.15)}
.nav .ic{width:15px;height:15px;flex:none}
.rail-foot{border-top:1px solid rgba(205,220,56,.35);padding:10px 12px;font-size:9.5px;color:#fff;line-height:1.7}
.rail-foot .row{display:flex;justify-content:space-between;gap:6px}
.rail-foot b{color:var(--lime);font-weight:700}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.topbar{flex:none;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line-2);
  padding:9px 14px;backdrop-filter:blur(6px);z-index:30;display:flex;flex-direction:column;gap:8px}
.tb-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.modeswitch{display:inline-flex;background:var(--well-2);border:2px solid var(--green);border-radius:var(--r);
  padding:2px;gap:2px;box-shadow:2px 2px 0 rgba(171,202,71,.45)}
.modeswitch button{border:0;background:transparent;cursor:pointer;padding:6px 13px;border-radius:2px;
  font-size:11px;font-weight:700;color:var(--green-dk);letter-spacing:.02em;transition:.12s;white-space:nowrap}
.modeswitch button:hover{background:#fff}
.modeswitch button.on{background:var(--green);color:#fff;box-shadow:1px 1px 0 rgba(0,0,0,.14)}
.fld{display:flex;flex-direction:column;gap:3px}
.fld > label{font-size:8px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-4);font-weight:700}
.selwrap{position:relative}
.sel{appearance:none;background:#fff;border:1px solid var(--line-2);border-radius:var(--r);
  padding:6px 26px 6px 9px;font-size:11px;font-weight:600;cursor:pointer;color:var(--ink)}
.sel:hover{border-color:var(--green)}
.selwrap::after{content:"▾";position:absolute;right:9px;top:50%;transform:translateY(-50%);
  pointer-events:none;font-size:9px;color:var(--green)}
.segs{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:#fff}
.segs button{border:0;border-right:1px solid var(--line);background:#fff;cursor:pointer;padding:6px 10px;
  font-size:11px;font-weight:600;color:var(--ink-3);transition:.1s;font-family:var(--ff-m)}
.segs button:last-child{border-right:0}
.segs button:hover{background:var(--well-2)}
.segs button.on{background:var(--green);color:#fff;font-weight:700}
.tb-sp{flex:1}
.tb-div{width:1px;align-self:stretch;background:var(--line);flex:none}
.clock{font-family:var(--ff-m);font-size:11px;color:var(--ink-3);text-align:right;line-height:1.3}
.clock b{color:var(--green-dk);font-weight:700}
.avatar{width:28px;height:28px;border-radius:2px;background:var(--green);color:#fff;display:grid;place-items:center;
  font-weight:700;font-size:10.5px;border:2px solid var(--lime);flex:none}

.tape{height:26px;flex:none;background:var(--green-dk);overflow:hidden;display:flex;align-items:center;border-bottom:2px solid var(--lime)}
.tape-in{display:flex;gap:24px;white-space:nowrap;animation:tick 52s linear infinite;padding-left:14px}
.tape:hover .tape-in{animation-play-state:paused}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk{font-family:var(--ff-m);font-size:10.5px;color:rgba(255,255,255,.8);display:flex;gap:6px;align-items:center}
.tk b{color:#fff;font-weight:500}
.tk .up{color:var(--lime)} .tk .dn{color:#FFBDB5}

.canvas{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.screen{animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;background:#fff;
  border:2px solid var(--green);border-radius:var(--r);padding:13px 16px;margin-bottom:14px;box-shadow:var(--sh-lime)}
.hero h1{font-size:23px;font-weight:700;margin:4px 0 3px;line-height:1.15}
.hero .tag{font-size:11.5px;color:var(--ink-3);margin:0;font-style:italic}
.hero-r{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.hero-r .pr{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:2px solid var(--green);border-radius:var(--r);padding:9px 11px;
  position:relative;overflow:hidden;cursor:pointer;transition:.12s}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--lime)}
.kpi{padding-left:15px}
.kpi:hover{box-shadow:var(--sh);transform:translateY(-1px)}
.kpi.acc-pos::before{background:var(--pos)} .kpi.acc-neg::before{background:var(--neg)}
.kpi.acc-warn::before{background:var(--warn)} .kpi.acc-info::before{background:var(--cyan)}
.kpi .k{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--green);margin:0;
  display:flex;justify-content:space-between;gap:5px;align-items:center;flex-wrap:wrap}
.kpi .v{font-family:var(--ff-d);font-weight:700;font-size:19px;color:var(--ink);margin:4px 0 0;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:10px;font-family:var(--ff-u);font-weight:600;color:var(--ink-4);margin-left:3px}
.kpi .s{font-size:9.5px;color:var(--ink-4);margin:2px 0 0;font-family:var(--ff-m)}
.kpi .s .up{color:var(--pos)} .kpi .s .dn{color:var(--neg)}

.c2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.c3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.c-23{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(300px,1fr);gap:12px}
.c-32{display:grid;grid-template-columns:minmax(290px,1fr) minmax(0,1.8fr);gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.c2>*,.c3>*,.c-23>*,.c-32>*,.stack>*{min-width:0}
.mb12{margin-bottom:12px}
@media(max-width:1500px){.c-23,.c-32,.c3{grid-template-columns:minmax(0,1fr)}}
@media(max-width:1150px){.c2{grid-template-columns:minmax(0,1fr)}}

.chart-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.chart-hd>div:first-child{min-width:0;flex:1 1 230px}
.chart-hd h3{font-family:var(--ff-u);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink);margin:0}
.chart-hd .src{font-size:9.5px;color:var(--ink-4);font-family:var(--ff-m);margin:3px 0 0;line-height:1.5}
.chart-hd .src a{color:var(--cyan-dk);text-decoration:underline dotted}
.legend{display:flex;flex-wrap:wrap;gap:9px 12px;margin-top:8px;font-size:9.5px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:3px;display:inline-block;border-radius:2px;flex:none}
.legend i.dash{background:repeating-linear-gradient(90deg,currentColor 0 3px,transparent 3px 6px)!important}
.legend i.band{height:9px;border-radius:1px;opacity:.4}
svg{display:block;overflow:visible}

.drivers{display:flex;flex-direction:column;gap:6px}
.dr{display:grid;grid-template-columns:minmax(80px,150px) minmax(24px,1fr) 62px;gap:9px;align-items:center;font-size:10.5px}
.dr .lbl{color:var(--ink-3);overflow-wrap:anywhere}
.dr .bar{height:7px;background:var(--well-2);border-radius:2px;overflow:hidden}
.dr .bar i{display:block;height:100%;background:var(--green-lt)}
.dr .bar i.neg{background:var(--neg)}
.dr .val{text-align:right;font-family:var(--ff-m);color:var(--ink);font-weight:500}

.stackbar{display:flex;height:28px;border-radius:2px;overflow:hidden;border:1px solid var(--line-2);margin:9px 0 8px}
.stackbar i{display:block;height:100%}
.sb-key{display:flex;flex-direction:column;gap:5px}
.sb-key .row{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:11px}
.sb-key .row .l{display:flex;gap:7px;align-items:center;min-width:0}
.sb-key em{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.sb-key .row .v{font-family:var(--ff-m);font-weight:500;white-space:nowrap}

.zgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.zone{background:var(--well);border:1px solid var(--line-2);border-radius:2px;padding:9px 10px;cursor:pointer;position:relative;overflow:hidden}
.zone:hover{border-color:var(--green);background:#fff;box-shadow:var(--sh)}
.zone .zn{font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-4);font-weight:700;font-family:var(--ff-m)}
.zone .zv{font-family:var(--ff-d);font-weight:700;font-size:16px;margin-top:3px;color:var(--ink)}
.zone .zs{font-size:9px;font-family:var(--ff-m);color:var(--ink-4);margin-top:2px}
.zone .zh{position:absolute;left:0;right:0;bottom:0;height:3px}
@media(max-width:1150px){.zgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}

.srcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:9px}
.src{background:var(--well);border:1px solid var(--line-2);border-radius:2px;padding:10px 11px}
.src:hover{background:#fff;box-shadow:var(--sh)}
.src .sn{font-size:11px;font-weight:700;color:var(--ink);display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.src .sn a{color:var(--green-dk);text-decoration:none}
.src .sn a:hover{text-decoration:underline}
.src .sm{font-size:9.5px;font-family:var(--ff-m);color:var(--ink-4);margin-top:5px;line-height:1.55}

.hrow{display:flex;flex-direction:column;gap:4px}
.hr2{display:grid;grid-template-columns:48px minmax(20px,1fr) 70px 64px;gap:9px;align-items:center;font-size:10.5px;
  padding:5px 8px;background:var(--well);border:1px solid var(--line);border-radius:2px}
.hr2.win{border-color:var(--green);background:var(--pos-bg)}
.hr2.chg{border-color:var(--cyan);background:var(--info-bg)}
.hr2 .h{font-family:var(--ff-m);color:var(--ink-4)}
.hr2 .bar{height:12px;background:var(--well-2);border-radius:1px;overflow:hidden}
.hr2 .bar i{display:block;height:100%}
.hr2 .p,.hr2 .q{font-family:var(--ff-m);text-align:right;color:var(--ink)}

.dec{background:#fff;border:1px solid var(--line-2);border-left:4px solid var(--lime);border-radius:var(--r);
  padding:12px 13px;margin-bottom:10px;box-shadow:var(--sh)}
.dec.done{border-left-color:var(--pos)} .dec.pend{border-left-color:var(--warn)}
.dec-hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:7px;flex-wrap:wrap}
.dec-hd h4{margin:0;font-size:12.5px;font-weight:700;color:var(--ink);flex:1 1 150px;overflow-wrap:anywhere}
.dec-hd>div{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dec-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.dec p.why{margin:0 0 9px;font-size:11.5px;color:var(--ink-2);line-height:1.6}
.dec .box{padding:9px 10px;background:var(--well);border:1px solid var(--line);border-radius:2px;margin-bottom:9px}
.fb{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding-top:9px;border-top:1px dashed var(--line-2)}
.fb .lb{font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink-4)}
.fb-note{margin:8px 0 0;font-size:10.5px;padding:7px 9px;border-radius:2px;display:none;border-left:3px solid var(--pos);
  background:var(--pos-bg);color:var(--pos)}
.fb-note.show{display:block}

.agent-chip{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;letter-spacing:.04em;
  padding:2px 7px;border-radius:2px;background:var(--pos-bg);border:1px solid #A9C97F;color:var(--pos);white-space:nowrap}
.agent-chip.mi{background:#F7FAE3;border-color:#C9D86E;color:#6B7A12}
.agent-chip.dq{background:var(--info-bg);border-color:#97CBDC;color:var(--info)}
.agent-chip.sg{background:var(--warn-bg);border-color:#DEC082;color:var(--warn)}
.agent-chip.sc{background:var(--mag-bg);border-color:#C2A8DA;color:var(--mag)}
.agent-chip.op{background:var(--pos-bg);border-color:#A9C97F;color:var(--pos)}
.agent-chip.mo{background:var(--neg-bg);border-color:#E3A9A2;color:var(--neg)}

.feed{max-height:330px;overflow-y:auto;margin:0 -4px}
.fitem{display:flex;gap:9px;padding:9px 4px;border-bottom:1px solid var(--line)}

<script>
/* =================================================================
   ASTREA · CO-OPERATIVE FORECAST DESK
   Configured for Socorro Electric Cooperative (SEC), central New Mexico.
   Substation peaks are SEC-reported 2023 figures. Everything derived from
   them is labelled on the Data & provenance screen.
   ================================================================= */
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const fmt=(n,d)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:d===undefined?0:d,maximumFractionDigits:d===undefined?0:d});
const MW=(n,d)=>fmt(n,d===undefined?1:d);
const H=n=>String(n).padStart(2,'0')+':00';
const HE=n=>'HE'+String(n+1).padStart(2,'0');
const AGENTS={sup:['Supervisor',''],mi:['Market Intelligence','mi'],dq:['Data Query','dq'],
  sg:['Signal / Causality','sg'],sc:['Scenario','sc'],op:['Optimization','op'],mo:['Monitor','mo']};
const AG=k=>'<span class="agent-chip '+AGENTS[k][1]+'">'+AGENTS[k][0]+'</span>';

/* ══════════ CO-OP PROFILE ══════════ */
const COOPS=[
 {id:'sec',n:'Socorro Electric Cooperative',loc:'Socorro, NM',on:true},
 {id:'cnm',n:'Central New Mexico Electric Co-op',loc:'Mountainair, NM',on:false},
 {id:'oce',n:'Otero County Electric Co-op',loc:'Cloudcroft, NM',on:false},
 {id:'sie',n:'Sierra Electric Co-op',loc:'Elephant Butte, NM',on:false},
 {id:'col',n:'Columbus Electric Co-op',loc:'Deming, NM',on:false},
 {id:'jem',n:'Jemez Mountains Electric Co-op',loc:'Española, NM',on:false}];

/* SEC substations — 2023 peak loads as reported by the co-operative.
   These are individual, non-coincident peaks. They do not sum to a system peak. */
const SUBS=[
 {c:'SOC69', n:'Socorro 69 kV',   pk2023:16.400,share:.434,mape:3.8,note:'Largest. Municipal, institutional and commercial core.'},
 {c:'SOC25', n:'Socorro 24.9 kV', pk2023:11.500,share:.305,mape:4.0,note:'New Mexico Tech campus, water and wastewater.'},
 {c:'SPRG',  n:'Springerville',   pk2023: 4.200,share:.111,mape:5.6,note:'Dispersed rural and agricultural.'},
 {c:'BERN',  n:'Bernardo',        pk2023: 2.900,share:.077,mape:6.1,note:'Agricultural, irrigation-driven in season.'},
 {c:'BURR',  n:'Burris',          pk2023: 2.500,share:.066,mape:6.4,note:'Rural residential and small commercial.'},
 {c:'BORD',  n:'Borderland',      pk2023: 0.252,share:.007,mape:9.2,note:'Very small. Noise dominates the relative error.'}];
const SUM_PEAKS=SUBS.reduce((a,b)=>a+b.pk2023,0);           /* 37.752 MW */
const DIVERSITY=0.84;                                        /* modelled */
const COINCIDENT=+(SUM_PEAKS*DIVERSITY).toFixed(1);          /* ≈ 31.7 MW */

/* ══════════ TODAY · Thu 29 Oct 2026 · hourly MW ══════════ */
const SEC={
 load:[13.2,12.6,12.2,12.0,11.9,12.4,14.1,16.2,16.8,16.1,15.4,15.0,
       15.2,15.6,16.0,16.4,17.1,18.3,19.8,19.5,18.4,17.0,15.4,14.0],
 actual:[13.3,12.5,12.3,12.1,11.8,12.5,14.3,16.0,16.9,null,null,null,
       null,null,null,null,null,null,null,null,null,null,null,null],
 /* seasonal naive: same hour, same weekday, previous week */
 naiveWk:[14.1,13.4,12.8,12.5,12.4,13.0,15.2,17.6,17.9,16.8,15.9,15.3,
       15.4,15.9,16.6,17.3,18.2,19.8,21.4,20.9,19.4,17.8,16.1,14.6],
 /* solar: NM Tech 664 kW carport plus modelled distributed rooftop ≈ 1.20 MW */
 solar:[0,0,0,0,0,0,0,0.05,0.42,0.88,1.24,1.45,1.55,1.50,1.33,1.02,0.58,0.14,0.01,0,0,0,0,0],
 temp:[44,42,41,40,39,39,42,48,55,61,66,69,71,72,72,71,68,63,57,53,50,48,46,45],
 dew:[28,28,27,27,26,26,27,29,30,30,29,28,27,26,26,27,28,30,31,31,30,29,29,28],
 /* daily peak: 7 days back, today, 13 forward */
 days:['22 Oct','23 Oct','24 Oct','25 Oct','26 Oct','27 Oct','28 Oct','29 Oct',
       '30 Oct','31 Oct','1 Nov','2 Nov','3 Nov','4 Nov','5 Nov','6 Nov','7 Nov','8 Nov','9 Nov','10 Nov','11 Nov'],
 dayPk:[20.4,19.1,18.2,17.6,19.9,20.8,20.1,19.8,19.4,18.1,17.3,19.6,20.9,21.4,20.8,19.9,21.8,23.2,22.6,21.1,20.4],
 dayLo:[null,null,null,null,null,null,null,19.2,18.6,17.2,16.3,18.5,19.7,20.1,19.4,18.5,20.2,21.3,20.7,19.3,18.6],
 dayHi:[null,null,null,null,null,null,null,20.4,20.3,19.1,18.4,20.8,22.2,22.8,22.3,21.4,23.5,25.2,24.6,23.0,22.3],
 dayAct:[20.6,19.0,18.0,17.9,20.1,20.6,20.3,null,null,null,null,null,null,null,null,null,null,null,null,null,null],
 today:7,
 /* accuracy over the 7-day retrospective window */
 mapeAstrea:[3.6,4.4,3.9,5.1,3.8,4.2,3.7],
 mapeNaiveWk:[9.8,13.1,10.4,15.6,9.2,11.8,10.1],
 mapeNaiveYr:[13.2,16.8,14.1,19.2,12.4,15.1,13.0]
};
SEC.netLoad=SEC.load.map((v,i)=>+(v-SEC.solar[i]).toFixed(2));

/* ══════════ SUPPLY POSITION ══════════ */
const SUPPLY={
 schedule:20.0,            /* assumed firm purchase schedule — SEC to confirm with Tri-State */
 bessMW:5, bessMWh:20,     /* PROPOSED, not an operating asset */
 bessOn:false
};

/* ══════════ SCENARIOS ══════════ */
const COMPRESSOR=[0.92,0.92,0.91,0.91,0.92,0.93,0.94,0.94,0.93,0.92,0.91,0.90,
                  0.90,0.91,0.92,0.93,0.94,0.94,0.93,0.92,0.92,0.92,0.92,0.92];
const EVLOAD   =[0.14,0.12,0.09,0.06,0.05,0.05,0.07,0.10,0.14,0.18,0.21,0.24,
                 0.26,0.25,0.23,0.22,0.24,0.28,0.33,0.38,0.36,0.30,0.24,0.18];
const DT_HOT   =[-0.42,-0.45,-0.47,-0.48,-0.46,-0.41,-0.38,-0.30,-0.14,0.10,0.28,0.44,
                 0.58,0.72,0.84,0.93,0.99,1.04,1.02,0.92,0.74,0.56,0.32,0.05];
const Z=new Array(24).fill(0);
const SCENARIOS={
 base:{id:'base',label:'Base case',short:'Base',d:Z,
   blurb:'The forecast as issued this morning, with no perturbation applied.'},
 hot:{id:'hot',label:'+5 °F across the day',short:'+5 °F',d:DT_HOT,
   blurb:'Every hourly temperature raised 5 °F, with the load response taken from SEC\'s own fitted temperature curve.'},
 newload:{id:'newload',label:'1 MW compressor station + EV charging',short:'New load',
   d:COMPRESSOR.map((v,i)=>+(v+EVLOAD[i]).toFixed(2)),
   blurb:'A 1 MW electric-drive compressor station at 92 % load factor, plus a modelled EV charging profile.'},
 both:{id:'both',label:'+5 °F and the new load together',short:'Both',
   d:DT_HOT.map((v,i)=>+(v+COMPRESSOR[i]+EVLOAD[i]).toFixed(2)),
   blurb:'Both perturbations applied at once — the planning case that matters.'}
};
let SCN='base';

function run(scn){
  const s=SCENARIOS[scn||SCN];
  const load=SEC.load.map((v,i)=>+(v+s.d[i]).toFixed(2));
  const net=load.map((v,i)=>+(v-SEC.solar[i]).toFixed(2));
  const sched=new Array(24).fill(SUPPLY.schedule);
  /* proposed BESS: shave the shortfall, recharge in the deepest net-load hours */
  let bess=new Array(24).fill(0), served=net.slice();
  if(SUPPLY.bessOn){
    let energy=SUPPLY.bessMWh;
    const order=net.map((v,i)=>({i,gap:v-SUPPLY.schedule})).filter(x=>x.gap>0).sort((a,b)=>b.gap-a.gap);
    for(const o of order){
      if(energy<=0)break;
      const d=Math.min(o.gap,SUPPLY.bessMW,energy);
      bess[o.i]=+d.toFixed(2); energy-=d; served[o.i]=+(net[o.i]-d).toFixed(2);
    }
    /* Recharge in the midday solar window first, then the overnight trough, and
       at half rated power so the charge spreads instead of spiking one hour. */
    const used=SUPPLY.bessMWh-energy;
    const rate=SUPPLY.bessMW/2;
    const ch=net.map((v,i)=>({i,v,rank:v-(i>=9&&i<=16?3.5:0)}))
                .filter(x=>bess[x.i]===0).sort((a,b)=>a.rank-b.rank);
    let need=used/0.88;
    for(const c of ch){ if(need<=0.01)break;
      const amt=Math.min(rate,need,Math.max(0,SUPPLY.schedule-net[c.i]-1.5));
      if(amt<=0.05)continue;
      bess[c.i]=-(+amt.toFixed(2)); need-=amt; served[c.i]=+(net[c.i]+amt).toFixed(2);
    }
  }
  const short=served.map((v,i)=>Math.max(0,+(v-SUPPLY.schedule).toFixed(2)));
  const shortRaw=net.map(v=>Math.max(0,+(v-SUPPLY.schedule).toFixed(2)));
  return {s,load,net,sched,bess,served,short,shortRaw,

function chart(o){
  const w=o.w||760,h=o.h||210,pl=o.pl||46,pr=o.pr||12,pt=10,pb=22;
  const iw=w-pl-pr, ih=h-pt-pb;
  let all=[];o.series.forEach(s=>all=all.concat(s.data.filter(v=>v!=null)));
  if(o.band)all=all.concat(o.band.lo.filter(v=>v!=null),o.band.hi.filter(v=>v!=null));
  if(o.deficit)all=all.concat(o.deficit.a,o.deficit.b);
  let mn=o.yMin!=null?o.yMin:Math.min(...all), mx=o.yMax!=null?o.yMax:Math.max(...all);
  const sp=(mx-mn)||1; if(o.yMin==null)mn-=sp*.10; if(o.yMax==null)mx+=sp*.12;
  const n=o.series[0].data.length;
  const X=i=>pl+(n<2?0:i*iw/(n-1)), Y=v=>pt+ih-((v-mn)/(mx-mn))*ih;
  let s='<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none" role="img">';
  const tk=o.yTicks||5;
  for(let t=0;t<=tk;t++){const v=mn+(mx-mn)*t/tk,y=Y(v);
    s+='<line x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(w-pr)+'" y2="'+y.toFixed(1)+'" stroke="#D8DFCB" stroke-width="1"/>';
    s+='<text x="'+(pl-7)+'" y="'+(y+3.3).toFixed(1)+'" text-anchor="end" fill="#767676" font-size="9" font-family="JetBrains Mono,monospace">'+(o.yFmt?o.yFmt(v):Math.round(v))+'</text>';}
  if(mn<0&&mx>0){const z=Y(0);s+='<line x1="'+pl+'" y1="'+z.toFixed(1)+'" x2="'+(w-pr)+'" y2="'+z.toFixed(1)+'" stroke="#9AA394" stroke-width="1.2"/>';}
  (o.xLabels||[]).forEach(l=>{s+='<text x="'+X(l.i).toFixed(1)+'" y="'+(h-6)+'" text-anchor="middle" fill="'+(l.c||'#767676')+'" font-size="9" font-family="JetBrains Mono,monospace"'+(l.b?' font-weight="700"':'')+'>'+l.t+'</text>';});
  (o.zones||[]).forEach(z=>{s+='<rect x="'+X(z.a).toFixed(1)+'" y="'+pt+'" width="'+(X(z.b)-X(z.a)).toFixed(1)+'" height="'+ih+'" fill="'+z.c+'" fill-opacity="'+(z.op||.12)+'"/>';
    if(z.t)s+='<text x="'+((X(z.a)+X(z.b))/2).toFixed(1)+'" y="'+(pt+11)+'" text-anchor="middle" fill="'+z.c+'" font-size="8.5" font-weight="700" font-family="JetBrains Mono,monospace">'+z.t+'</text>';});
  if(o.band){let p='';o.band.hi.forEach((v,i)=>{if(v==null)return;p+=(p?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1)});
    for(let i=o.band.lo.length-1;i>=0;i--){if(o.band.lo[i]==null)continue;p+='L'+X(i).toFixed(1)+','+Y(o.band.lo[i]).toFixed(1)}
    if(p)s+='<path d="'+p+'Z" fill="'+(o.band.color||'#ABCA47')+'" fill-opacity="'+(o.band.op||.3)+'"/>';}
  /* shaded region wherever a exceeds b — the purchase shortfall */
  if(o.deficit){
    const A=o.deficit.a,B=o.deficit.b,col=o.deficit.color||'#C23B2E';
    const cross=(i)=>{const d0=A[i-1]-B[i-1],d1=A[i]-B[i];const t=d0/(d0-d1);return i-1+t;};
    let i=0;
    while(i<n){
      if(A[i]>B[i]){
        let st=i; while(i<n&&A[i]>B[i])i++;
        const en=i-1;
        const x0=st>0?cross(st):st, x1=en<n-1?cross(en+1):en;
        let p='M'+X(x0).toFixed(1)+','+Y(B[st]+(A[st]-B[st])*0).toFixed(1);
        p='M'+X(x0).toFixed(1)+','+Y(st>0?(B[st-1]+(B[st]-B[st-1])*(x0-(st-1))):B[st]).toFixed(1);
        for(let k=st;k<=en;k++)p+='L'+X(k).toFixed(1)+','+Y(A[k]).toFixed(1);
        p+='L'+X(x1).toFixed(1)+','+Y(en<n-1?(B[en]+(B[en+1]-B[en])*(x1-en)):B[en]).toFixed(1);
        for(let k=en;k>=st;k--)p+='L'+X(k).toFixed(1)+','+Y(B[k]).toFixed(1);
        s+='<path d="'+p+'Z" fill="'+col+'" fill-opacity="'+(o.deficit.op||.26)+'" stroke="'+col+'" stroke-width="1" stroke-opacity=".5"/>';
      } else i++;
    }
  }
  o.series.forEach(se=>{
    if(se.type==='bar'){const bw=Math.max(2,iw/n*(se.bw||.62));
      se.data.forEach((v,i)=>{if(v==null||v===0)return;const y0=Y(Math.max(0,mn)),y1=Y(v);
        s+='<rect x="'+(X(i)-bw/2+(se.off||0)).toFixed(1)+'" y="'+Math.min(y0,y1).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1,Math.abs(y1-y0)).toFixed(1)+'" fill="'+se.color+'" fill-opacity="'+(se.op||.9)+'" rx="1"/>';});
      return;}
    if(se.type==='area'){let p='';se.data.forEach((v,i)=>p+=(i?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1));
      s+='<path d="'+p+'L'+X(n-1).toFixed(1)+','+Y(Math.max(0,mn)).toFixed(1)+'L'+X(0).toFixed(1)+','+Y(Math.max(0,mn)).toFixed(1)+'Z" fill="'+se.color+'" fill-opacity="'+(se.op||.22)+'"/>';
      s+='<path d="'+p+'" fill="none" stroke="'+se.color+'" stroke-width="'+(se.w||1.6)+'"/>';return;}
    let p='',brk=true;
    se.data.forEach((v,i)=>{if(v==null){brk=true;return}p+=(brk?'M':'L')+X(i).toFixed(1)+','+Y(v).toFixed(1);brk=false;});
    s+='<path d="'+p+'" fill="none" stroke="'+se.color+'" stroke-width="'+(se.w||2)+'"'+(se.dash?' stroke-dasharray="'+se.dash+'"':'')+' stroke-linejoin="round" stroke-linecap="round"/>';
    if(se.dots)se.data.forEach((v,i)=>{if(v!=null)s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="2.3" fill="'+se.color+'"/>';});
  });
  (o.marks||[]).forEach(m=>{s+='<line x1="'+X(m.i).toFixed(1)+'" y1="'+pt+'" x2="'+X(m.i).toFixed(1)+'" y2="'+(pt+ih)+'" stroke="'+m.c+'" stroke-width="1.2" stroke-dasharray="3 3"/>'+
    '<text x="'+(X(m.i)+4).toFixed(1)+'" y="'+(pt+10)+'" fill="'+m.c+'" font-size="9" font-weight="700" font-family="JetBrains Mono,monospace">'+m.t+'</text>';});
  (o.hlines||[]).forEach(l=>{s+='<line x1="'+pl+'" y1="'+Y(l.v).toFixed(1)+'" x2="'+(w-pr)+'" y2="'+Y(l.v).toFixed(1)+'" stroke="'+l.c+'" stroke-width="'+(l.w||1.8)+'"'+(l.dash?' stroke-dasharray="'+l.dash+'"':'')+'/>'+
    (l.t?'<text x="'+(pl+6)+'" y="'+(Y(l.v)-5).toFixed(1)+'" fill="'+l.c+'" font-size="9" font-weight="700" font-family="JetBrains Mono,monospace">'+l.t+'</text>':'');});
  (o.pts||[]).forEach(q=>{s+='<circle cx="'+X(q.i).toFixed(1)+'" cy="'+Y(q.v).toFixed(1)+'" r="3.6" fill="'+q.c+'" stroke="#fff" stroke-width="1.6"/>';
    if(q.t)s+='<text x="'+X(q.i).toFixed(1)+'" y="'+(Y(q.v)-9).toFixed(1)+'" text-anchor="middle" fill="'+q.c+'" font-size="9.5" font-weight="700" font-family="JetBrains Mono,monospace">'+q.t+'</text>';});
  return s+'</svg>';
}

function matchIntent(t){
 const q=t.toLowerCase();
 if(/reset|base case|clear|start over|back to base/.test(q))return 'base';
 if(/both|together|combine|all of|at once/.test(q))return 'both';
 if(/accur|naive|benchmark|mape|error|how good|better than/.test(q))return 'accuracy';
 if(/driv|why|explain|what.*causing|contribut/.test(q))return 'drivers';
 if(/compressor|ev\b|electric vehicle|charging|new load|interconnect|added load/.test(q))return 'newload';
 if(/(\b5\b|five|\b10\b|ten)?.*(degree|hotter|warmer|warm|heat|temperature|hot)/.test(q))return 'hot';
 return null;
}

 +'<div style="height:12px"></div>'
 +'<div class="c2">'
 +card(rule('What this demonstration is','and what it is not')
   +'<p class="callout" style="margin-bottom:10px"><b>This is a shaped demonstration, not a forecast of SEC\'s actual load.</b> The six substation peaks are real and SEC-reported. Everything hourly is a modelled shape fitted to those peaks and to central New Mexico climatology, because no interval data has been provided yet.</p>'
   +'<p class="note">What it does demonstrate faithfully: the method, the explanation, the scenario mechanics, the accuracy framing and the supply-position logic. Load one year of 15-minute data and every modelled row above becomes a measured one — with no change to the screens.</p>'
   +'<hr class="hair">'
   +'<p class="sect" style="border:0;margin:0 0 8px">Three things worth correcting early</p>'
   +['<b>37.752 MW is not SEC\'s system peak.</b> It is six individual peaks from six different moments. The coincident figure is closer to 31.7 MW, and the gap is about the size of the proposed battery.',

    .map(t=>'<p class="callout warn" style="margin-bottom:8px">'+t+'</p>').join(''),'hi')

/* ══════════ NAV · ROUTER · EVENTS ══════════ */

}
function renderNav(){
 $('#railNav').innerHTML=NAV.map(g=>'<div class="navgrp">'+g[0]+'</div>'
  +g[1].map(n=>'<div class="nav '+(SCR===n[0]?'on':'')+'" data-act="go" data-s="'+n[0]+'" role="button" tabindex="0">'
    +ICON(n[0])+'<span>'+n[1]+'</span></div>').join('')).join('');
}
function renderTape(){
 const r=R;
 const t=[['SEC PEAK TODAY',MW(r.peak),'MW @'+HE(r.peakH),SCN==='base'?'':(r.dPeak>0?'+':'')+MW(r.dPeak),'dn'],
  ['ENERGY',fmt(r.energy),'MWh','','f'],['NET LOAD PEAK',MW(r.netPeak),'MW','','f'],
  ['LOCAL SOLAR','1.55','MW @HE13','','f'],['COINCIDENT SUMMER PK','31.7','MW','modelled','f'],
  ['SUM OF SUB PEAKS','37.8','MW 2023','non-coincident','f'],
  ['MAPE','4.1','% Astrea','vs 11.4% naive','up'],['MAE','0.61','MW','naive 1.72','up'],
  ['PURCHASE SCHEDULE',MW(SUPPLY.schedule),'MW','assumed','f'],
  ['SHORTFALL',r.shortMW>0?MW(r.shortMW):'0.0','MW',r.shortMW>0?MW(r.shortMWh)+' MWh':'none',r.shortMW>0?'dn':'up'],
  ['SCENARIO',SCENARIOS[SCN].short,'','','f'],['14-DAY MAX','23.2','MW 8 Nov','cold morning','f']]
  .map(x=>'<span class="tk">'+x[0]+' <b>'+x[1]+'</b> '+x[2]+(x[3]?' <span class="'+(x[4]==='up'?'up':x[4]==='dn'?'dn':'')+'">'+x[3]+'</span>':'')+'</span>').join('');
 $('#tapeIn').innerHTML=t+t;
}
function renderTop(){
 $('#selCoop').innerHTML=COOPS.map(c=>'<option '+(c.id==='sec'?'selected':'')+(c.on?'':' disabled')+'>'
   +c.n+' — '+c.loc+(c.on?'':' · not configured')+'</option>').join('');
 $('#selSub').innerHTML=['All substations (system)'].concat(SUBS.map(s=>s.c+' · '+s.n))
   .map((o,i)=>'<option '+(i===0?'selected':'')+'>'+o+'</option>').join('');
 $('#selHz').innerHTML=['7 days back · 14 days forward','Day-ahead hourly','Intra-day (4 h rolling)','Seasonal (12 months)']
   .map((o,i)=>'<option '+(i===0?'selected':'')+'>'+o+'</option>').join('');
 $('#segScn').innerHTML=Object.values(SCENARIOS)
   .map(s=>'<button data-act="scn" data-v="'+s.id+'" class="'+(SCN===s.id?'on':'')+'">'+s.short+'</button>').join('');
}
function wrapTables(root){
 $$('table.tbl',root).forEach(t=>{ if(t.parentElement&&t.parentElement.classList.contains('tblwrap'))return;
  const w=document.createElement('div'); w.className='tblwrap';
  t.parentNode.insertBefore(w,t); w.appendChild(t); });
}
function go(s){
 if(!SCREENS[s])return;
 SCR=s; renderNav(); renderTop(); renderTape();
 const c=$('#canvas'); c.innerHTML='<div class="screen">'+SCREENS[s]()+'</div>'; wrapTables(c); c.scrollTop=0;
 if(s==='scenario'){renderChat(); const i=$('#cin'); if(i)i.focus();}
}
function setScn(v){ SCN=v; R=run(); go(SCR);
 toast(v==='base'?'<b>Base case restored.</b> Peak '+MW(R.peak)+' MW, no shortfall against the assumed schedule.'
  :'<b>'+SCENARIOS[v].label+'.</b> Peak '+MW(R.peak)+' MW ('+(R.dPeak>0?'+':'')+MW(R.dPeak)+' MW), '
   +(R.rawMW>0?MW(R.rawMW)+' MW above the assumed purchase schedule across '+MW(R.rawMWh)+' MWh.':'still within the assumed schedule.'));
}

 $('#drTitle').textContent=t||'Audit trail';
 $('#drBody').innerHTML='<dl class="kv">'
  +[['run_id','coop·sec·d01'],['Co-operative','Socorro Electric Cooperative'],
    ['Agent','Market Intelligence (specialist)'],['Engine','Quantile gradient boosting + calendar/weather features'],

    ['Hourly shape','Fitted to peaks + climatology','<span class="pill warn">MODELLED</span>'],
    ['Temperature and dew point','NWS Socorro KONM','<span class="pill ok">PUBLIC</span>'],
    ['Forecast grids','NOAA GFS / NBM','<span class="pill ok">PUBLIC</span>'],
    ['Academic calendar','New Mexico Tech','<span class="pill ok">PUBLIC</span>'],
    ['Sunset table','NOAA solar calculator','<span class="pill ok">PUBLIC</span>'],

    ['ok','Data Query · pull','NWS observations and forecast grids, academic calendar, sunset table, SEC substation history.'],
    ['ok','Forecasting service','Hourly P10/P50/P90, system and six substations. Deterministic, seeded.'],
    ['ok','Scenario service','Perturbation applied to the same artifact — the base forecast is never overwritten.'],
    ['ok','Monitor · scoring','Retrospective window scored against outturn; seasonal naive computed on the same series.'],
    ['ok','Supervisor · synthesis','Narrated and cited. Every figure read from the model output, none generated.']]
   .map(s=>'<div class="step '+s[0]+'"><h5>'+s[1]+'</h5><p>'+s[2]+'</p></div>').join('')+'</div>'
  +'<div class="card" style="margin-top:6px;background:var(--pos-bg);border-color:#A9C97F;box-shadow:none">'
  +'<p class="kicker">The contract</p><p class="tiny" style="margin:7px 0 0;line-height:1.75;color:var(--ink-2)">'
  +'The language model reasons, routes and explains. It <b style="color:var(--neg)">never</b> computes a forecast value. '
  +'Every number traces to a versioned artifact and a run ID, and every figure on this desk carries a confidence label.</p></div>';
 wrapTables($('#drBody'));
 $('#drawer').classList.add('on'); $('#scrim').classList.add('on');
}
const closeAll=()=>{$('#drawer').classList.remove('on');$('#scrim').classList.remove('on');};
let tmr; function toast(t){const e=$('#toast');e.innerHTML=t;e.classList.add('on');clearTimeout(tmr);tmr=setTimeout(()=>e.classList.remove('on'),5600);}

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]'); if(!el)return;
 const a=el.dataset.act;
 if(a==='go')go(el.dataset.s);
 else if(a==='scn')setScn(el.dataset.v);
 else if(a==='ask')ask(el.dataset.k);
 else if(a==='audit')openAudit(el.dataset.t);
 else if(a==='bess'){SUPPLY.bessOn=!SUPPLY.bessOn;R=run();go(SCR);
   toast(SUPPLY.bessOn
    ?'<b>Proposed 5 MW / 20 MWh battery included.</b> This is a future asset, not an operating resource — it is labelled everywhere it appears.'
    :'<b>Battery excluded.</b> Showing SEC\'s position with only the resources that exist today.');}
});
document.addEventListener('input',e=>{
 if(e.target.id==='schd'){SUPPLY.schedule=+e.target.value;R=run();
   const v=e.target.closest('.rngwrap').querySelector('.rngval');
   if(v)v.innerHTML=MW(SUPPLY.schedule)+'<small>MW</small>';}
});
document.addEventListener('change',e=>{
 if(e.target.id==='schd'){go(SCR);}
 else if(e.target.id==='selSub')toast('Scope → <b>'+e.target.value+'</b>. In the deployed product this filters every screen to that substation.');
 else if(e.target.id==='selHz')toast('Horizon → <b>'+e.target.value+'</b>.');
 else if(e.target.id==='selCoop')toast('Only Socorro Electric Cooperative is configured in this demonstration.');
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape')closeAll();
 if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='cin'){e.preventDefault();
   const v=e.target.value.trim(); if(!v)return; e.target.value=''; askFree(v);}
});
document.addEventListener('click',e=>{
 if(e.target.id==='csend'){const i=$('#cin'),v=i.value.trim(); if(!v)return; i.value=''; askFree(v);}
});
$('#drClose').onclick=closeAll; $('#scrim').onclick=closeAll;
setInterval(()=>{const d=new Date();
 $('#clkT').textContent='09:14:'+String(d.getSeconds()).padStart(2,'0');},1000);

renderTop(); renderTape(); renderNav(); go('overview');
</script>
