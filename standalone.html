<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Astrea Operations Desk</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap');

/* ============================================================
   ASTREA DESIGN TOKENS  —  Nuvve green, dark trading-desk variant
   Derived from energy-poc.camereye.ai
   ============================================================ */
:root{
  /* brand */
  --nv-green:        #759840;
  --nv-green-dk:     #5F7D33;
  --nv-green-lt:     #ABCA47;
  --nv-lime:         #CDDC38;
  --nv-cyan:         #73CEE5;
  --nv-cream:        #F2F1EF;

  /* dark canvas ramp */
  --bg-0:  #0B100C;   /* app ground */
  --bg-1:  #111811;   /* rail / topbar */
  --bg-2:  #16201703; /* unused */
  --panel: #141C15;   /* cards */
  --panel-2:#1A241B;  /* nested / hover */
  --panel-3:#202C21;  /* input wells */

  /* strokes */
  --line:      rgba(117,152,64,.28);
  --line-soft: rgba(117,152,64,.15);
  --line-hard: rgba(205,220,56,.55);

  /* text */
  --tx-0: #EDF2E7;
  --tx-1: #C3CFBA;
  --tx-2: #8D9A85;
  --tx-3: #63705C;

  /* semantic */
  --pos:  #ABCA47;
  --neg:  #E5695E;
  --warn: #E8B84B;
  --info: #73CEE5;
  --mag:  #C89BE0;

  /* type */
  --ff-display: 'Merriweather', Georgia, serif;
  --ff-ui: 'Montserrat', system-ui, sans-serif;
  --ff-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;

  --r: 4px;                       /* POC uses 4px everywhere */
  --sh-hard: 3px 3px 0 rgba(117,152,64,.22);
  --sh-lime: 4px 4px 0 rgba(205,220,56,.28);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg-0);
  color:var(--tx-0);
  font-family:var(--ff-ui);
  font-size:13px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(117,152,64,.3);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:rgba(171,202,71,.5)}

/* ---------- primitives ---------- */
.kicker{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--nv-green-lt);margin:0}
.sect{font-size:10px;letter-spacing:.17em;text-transform:uppercase;font-weight:700;color:var(--nv-green-lt);
  border-bottom:2px solid rgba(205,220,56,.35);padding-bottom:5px;margin:0 0 12px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.sect .r{border:0;font-weight:600;letter-spacing:.06em;color:var(--tx-2)}
.mono{font-family:var(--ff-mono)}
.num{font-family:var(--ff-display);font-weight:700;font-variant-numeric:tabular-nums}
.muted{color:var(--tx-2)}
.tiny{font-size:10.5px}
.hair{height:1px;background:var(--line-soft);border:0;margin:12px 0}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:3px 7px;border-radius:2px;border:1px solid var(--line);color:var(--tx-1);background:rgba(117,152,64,.10);white-space:nowrap}
.pill.lime{background:var(--nv-lime);color:#0B100C;border-color:var(--nv-lime)}
.pill.ok{background:rgba(171,202,71,.16);border-color:rgba(171,202,71,.5);color:var(--pos)}
.pill.bad{background:rgba(229,105,94,.14);border-color:rgba(229,105,94,.5);color:var(--neg)}
.pill.warn{background:rgba(232,184,75,.14);border-color:rgba(232,184,75,.5);color:var(--warn)}
.pill.info{background:rgba(115,206,229,.13);border-color:rgba(115,206,229,.45);color:var(--info)}
.pill.mag{background:rgba(200,155,224,.13);border-color:rgba(200,155,224,.45);color:var(--mag)}
.pill.ghost{background:transparent}
.dot{width:6px;height:6px;border-radius:50%;background:var(--pos);display:inline-block;flex:none}
.dot.live{animation:pulse 1.9s ease-in-out infinite}
.dot.w{background:var(--warn)} .dot.b{background:var(--neg)} .dot.i{background:var(--info)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.32}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  background:rgba(117,152,64,.14);border:1px solid var(--line);color:var(--tx-0);
  border-radius:var(--r);padding:6px 11px;font-size:11px;font-weight:600;transition:.13s;white-space:nowrap}
.btn:hover{background:rgba(171,202,71,.2);border-color:var(--nv-green-lt)}
.btn.pri{background:var(--nv-green);border-color:var(--nv-green);color:#fff}
.btn.pri:hover{background:var(--nv-green-lt);border-color:var(--nv-green-lt);color:#0B100C}
.btn.cta{background:var(--nv-lime);border-color:var(--nv-lime);color:#0B100C;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;font-size:10px}
.btn.cta:hover{background:var(--nv-green-lt)}
.btn.sm{padding:4px 8px;font-size:10px}
.btn.danger:hover{background:rgba(229,105,94,.2);border-color:var(--neg)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.hi{border-color:rgba(205,220,56,.4);box-shadow:var(--sh-lime)}
.card.flush{padding:0;overflow:hidden}
.grid{display:grid;gap:12px}

table.tbl{width:100%;min-width:100%;border-collapse:collapse;font-size:11.5px}
table.tbl th{text-align:left;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--tx-2);
  font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line);background:rgba(117,152,64,.06);white-space:nowrap}
table.tbl td{padding:7px 9px;border-bottom:1px solid var(--line-soft);vertical-align:middle;overflow-wrap:anywhere}
table.tbl tbody tr:hover{background:rgba(117,152,64,.07)}
table.tbl td.r,table.tbl th.r{text-align:right;font-family:var(--ff-mono);font-variant-numeric:tabular-nums}
table.tbl th.r{font-family:var(--ff-ui)}

/* ============================================================
   APP SHELL
   ============================================================ */
.app{display:grid;grid-template-columns:212px 1fr;height:100vh;width:100vw}

/* --- left rail --- */
.rail{background:linear-gradient(180deg,#141C15 0%,#111811 60%,#0E140E 100%);
  border-right:3px solid var(--nv-lime);display:flex;flex-direction:column;overflow:hidden}
.rail-brand{padding:14px 14px 12px;border-bottom:1px solid var(--line-soft)}
.logo{font-family:var(--ff-display);font-weight:900;font-size:18px;letter-spacing:.16em;color:var(--nv-cream);margin:0}
.logo span{color:var(--nv-lime)}
.rail-brand .sub{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--tx-2);margin:3px 0 0}
.rail-scroll{flex:1;overflow-y:auto;padding:11px 10px 8px}
.navgrp{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--tx-3);font-weight:700;margin:14px 4px 6px}
.navgrp:first-child{margin-top:2px}
.nav{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:var(--r);cursor:pointer;
  color:var(--tx-1);font-size:11.5px;font-weight:600;margin-bottom:3px;border:1px solid transparent;transition:.12s}
.nav:hover{background:rgba(0,0,0,.35);border-color:var(--line);color:var(--tx-0)}
.nav.on{background:var(--nv-lime);color:#0B100C;font-weight:700;border-color:var(--nv-lime);box-shadow:2px 2px 0 rgba(0,0,0,.35)}
.nav .ic{width:15px;height:15px;flex:none;opacity:.9}
.nav.on .ic{opacity:1}
.nav .bdg{margin-left:auto;font-family:var(--ff-mono);font-size:9px;font-weight:700;padding:1px 5px;border-radius:2px;
  background:rgba(232,184,75,.2);color:var(--warn);border:1px solid rgba(232,184,75,.4)}
.nav.on .bdg{background:rgba(0,0,0,.22);color:#0B100C;border-color:rgba(0,0,0,.3)}
.rail-foot{border-top:1px solid var(--line-soft);padding:10px 12px;font-size:9.5px;color:var(--tx-3);line-height:1.6}
.rail-foot .row{display:flex;justify-content:space-between;gap:6px}
.rail-foot b{color:var(--nv-green-lt);font-weight:700}

/* --- main column --- */
.main{display:flex;flex-direction:column;min-width:0;background:
  repeating-linear-gradient(-45deg,transparent,transparent 11px,rgba(117,152,64,.022) 11px,rgba(117,152,64,.022) 12px),
  radial-gradient(1200px 500px at 15% -10%, rgba(117,152,64,.09), transparent 70%),
  var(--bg-0)}

.topbar{height:52px;flex:none;background:rgba(17,24,17,.94);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:0 14px;backdrop-filter:blur(6px);z-index:30}
.selwrap{position:relative}
.sel{appearance:none;background:var(--panel-3);border:1px solid var(--line);border-radius:var(--r);
  padding:6px 26px 6px 9px;font-size:11px;font-weight:600;cursor:pointer;color:var(--tx-0);max-width:260px}
.sel:hover{border-color:var(--nv-green-lt)}
.sel:focus{outline:none;border-color:var(--nv-lime)}
.selwrap::after{content:"▾";position:absolute;right:9px;top:50%;transform:translateY(-50%);
  pointer-events:none;font-size:9px;color:var(--nv-lime)}
.sel-lbl{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-3);font-weight:700;display:block;margin-bottom:3px}
.tb-div{width:1px;height:26px;background:var(--line);flex:none}
.tb-sp{flex:1}
.clock{font-family:var(--ff-mono);font-size:11px;color:var(--tx-1);text-align:right;line-height:1.3}
.clock b{color:var(--nv-lime);font-weight:700}
.avatar{width:28px;height:28px;border-radius:2px;background:var(--nv-green);color:#fff;display:grid;place-items:center;
  font-weight:700;font-size:10.5px;border:1px solid var(--nv-lime);flex:none}

/* --- ticker tape --- */
.tape{height:26px;flex:none;background:#0E140E;border-bottom:1px solid var(--line-soft);overflow:hidden;display:flex;align-items:center}
.tape-in{display:flex;gap:26px;white-space:nowrap;animation:tick 46s linear infinite;padding-left:14px}
.tape:hover .tape-in{animation-play-state:paused}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk{font-family:var(--ff-mono);font-size:10.5px;color:var(--tx-2);display:flex;gap:6px;align-items:center}
.tk b{color:var(--tx-0);font-weight:500}
.tk .up{color:var(--pos)} .tk .dn{color:var(--neg)}

/* --- workspace --- */
.workspace{flex:1;display:flex;min-height:0}
.canvas{flex:1;overflow-y:auto;padding:16px;min-width:0}
.screen{display:none;animation:fade .22s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* --- page hero --- */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;background:var(--panel);
  border:1px solid var(--nv-green);border-left:4px solid var(--nv-lime);border-radius:var(--r);
  padding:13px 16px;margin-bottom:14px;box-shadow:var(--sh-hard)}
.hero h1{font-family:var(--ff-display);font-size:22px;font-weight:700;color:var(--nv-cream);margin:3px 0 3px;line-height:1.15}
.hero .tag{font-size:11.5px;color:var(--tx-2);margin:0;font-style:italic}
.hero-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}

/* --- KPI strip --- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:9px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px 9px 13px;
  position:relative;overflow:hidden;cursor:pointer;transition:.13s}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--nv-lime)}
.kpi:hover{border-color:var(--nv-green-lt);background:var(--panel-2);transform:translateY(-1px)}
.kpi.acc-pos::before{background:var(--pos)} .kpi.acc-neg::before{background:var(--neg)}
.kpi.acc-warn::before{background:var(--warn)} .kpi.acc-info::before{background:var(--info)}
.kpi .k{font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--nv-green-lt);margin:0;
  display:flex;justify-content:space-between;gap:5px;align-items:center;flex-wrap:wrap}
.kpi .v{font-family:var(--ff-display);font-weight:700;font-size:19px;color:var(--tx-0);margin:4px 0 0;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:10px;font-family:var(--ff-ui);font-weight:600;color:var(--tx-2);margin-left:3px}
.kpi .s{font-size:9.5px;color:var(--tx-2);margin:2px 0 0;font-family:var(--ff-mono)}
.kpi .s .up{color:var(--pos)} .kpi .s .dn{color:var(--neg)}
.kpi .spark{position:absolute;right:0;bottom:0;opacity:.5}

/* --- layout helpers --- */
.c2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.c3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.c-23{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(300px,1fr);gap:12px}
.c-32{display:grid;grid-template-columns:minmax(300px,1fr) minmax(0,1.7fr);gap:12px}
.c2>*,.c3>*,.c-23>*,.c-32>*,.stack>*{min-width:0}
.card{min-width:0}
.tblwrap{overflow-x:auto;max-width:100%}
.tblwrap::-webkit-scrollbar{height:7px}

.stack{display:flex;flex-direction:column;gap:12px}
.mb12{margin-bottom:12px}
@media(max-width:1560px){.c-23,.c-32,.c3{grid-template-columns:minmax(0,1fr)}}
@media(max-width:1520px){.copilot{width:352px}.app{grid-template-columns:190px 1fr}}
@media(max-width:1180px){.c2{grid-template-columns:minmax(0,1fr)}}

/* --- chart chrome --- */
.chart-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.chart-hd>div:first-child{min-width:0;flex:1 1 220px}
.chart-hd h3{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--tx-0);margin:0}
.chart-hd .src{font-size:9.5px;color:var(--tx-3);font-family:var(--ff-mono);margin:2px 0 0}
.legend{display:flex;flex-wrap:wrap;gap:9px 11px;margin-top:8px;font-size:9.5px;color:var(--tx-2)}
.legend i{width:11px;height:2.5px;display:inline-block;margin-right:5px;vertical-align:middle;border-radius:2px}
.legend i.dash{background:repeating-linear-gradient(90deg,currentColor 0 3px,transparent 3px 6px)}
.legend i.band{height:8px;border-radius:1px;opacity:.35}
svg{display:block;overflow:visible}
.gl{stroke:rgba(117,152,64,.14);stroke-width:1}
.axl{fill:var(--tx-3);font-size:8.5px;font-family:var(--ff-mono)}

/* --- agent bits --- */
.agent-chip{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;letter-spacing:.05em;
  padding:2px 7px;border-radius:2px;background:rgba(117,152,64,.16);border:1px solid var(--line);color:var(--nv-green-lt);white-space:nowrap}
.agent-chip.mi{background:rgba(205,220,56,.14);border-color:rgba(205,220,56,.45);color:var(--nv-lime)}
.agent-chip.dq{background:rgba(115,206,229,.13);border-color:rgba(115,206,229,.4);color:var(--info)}
.agent-chip.sc{background:rgba(200,155,224,.13);border-color:rgba(200,155,224,.4);color:var(--mag)}
.agent-chip.op{background:rgba(171,202,71,.15);border-color:rgba(171,202,71,.45);color:var(--pos)}
.agent-chip.sg{background:rgba(232,184,75,.14);border-color:rgba(232,184,75,.45);color:var(--warn)}
.agent-chip.mo{background:rgba(229,105,94,.13);border-color:rgba(229,105,94,.4);color:var(--neg)}

.feed{max-height:320px;overflow-y:auto;margin:-2px -4px 0}
.fitem{display:flex;gap:9px;padding:9px 4px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.fitem:hover{background:rgba(117,152,64,.06)}
.fitem .t{font-family:var(--ff-mono);font-size:9.5px;color:var(--tx-3);flex:none;width:44px;padding-top:2px;line-height:1.35}
.fitem .bd{flex:1;min-width:0}
.fitem .bd p{margin:3px 0 0;font-size:11px;color:var(--tx-1);line-height:1.45}
.fitem .bd .hdr{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* --- decision card w/ analyst feedback --- */
.dec{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--nv-lime);border-radius:var(--r);padding:12px 13px;margin-bottom:10px}
.dec.pend{border-left-color:var(--warn)}
.dec.done{border-left-color:var(--pos)}
.dec.rej{border-left-color:var(--neg)}
.dec-hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:7px;flex-wrap:wrap}
.dec-hd>div{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dec-hd h4{margin:0;font-size:12.5px;font-weight:700;color:var(--tx-0);min-width:0;overflow-wrap:anywhere;flex:1 1 140px}
.dec-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.dec p.why{margin:0 0 9px;font-size:11.5px;color:var(--tx-1);line-height:1.55}
.drivers{display:flex;flex-direction:column;gap:5px;margin:0 0 10px;padding:9px 10px;background:rgba(0,0,0,.25);border-radius:2px;border:1px solid var(--line-soft)}
.dr{display:grid;grid-template-columns:minmax(80px,148px) minmax(24px,1fr) 56px;gap:9px;align-items:center;font-size:10.5px}
.dr .lbl{color:var(--tx-2);overflow-wrap:anywhere}
.dr .bar{height:6px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden}
.dr .bar i{display:block;height:100%;background:var(--nv-green-lt)}
.dr .bar i.neg{background:var(--neg)}
.dr .val{text-align:right;font-family:var(--ff-mono);color:var(--tx-0);font-weight:500}
.fb{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding-top:9px;border-top:1px dashed var(--line)}
.fb .lb{font-size:9px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--tx-3);margin-right:2px}
.fb-note{margin:8px 0 0;font-size:10.5px;color:var(--pos);background:rgba(171,202,71,.1);
  border-left:3px solid var(--pos);padding:7px 9px;border-radius:2px;display:none}
.fb-note.show{display:block}

/* --- copilot / chat --- */
.copilot{width:406px;flex:none;background:linear-gradient(180deg,#131B14,#0F150F);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;transition:width .2s}
.copilot.wide{width:640px}
.cp-hd{flex:none;padding:11px 13px;border-bottom:1px solid var(--line);background:rgba(117,152,64,.07)}
.cp-hd .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cp-hd h3{margin:0;font-family:var(--ff-display);font-size:14px;color:var(--nv-cream);font-weight:700}
.cp-hd .top .btns{display:flex;gap:5px}
.iconbtn{width:23px;height:23px;display:grid;place-items:center;border-radius:2px;border:1px solid var(--line);
  background:transparent;cursor:pointer;color:var(--tx-2);font-size:12px}
.iconbtn:hover{border-color:var(--nv-lime);color:var(--nv-lime)}
.cp-agents{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.aq{font-size:9px;font-weight:700;letter-spacing:.04em;padding:3px 6px;border-radius:2px;cursor:pointer;
  border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--tx-2);transition:.12s}
.aq:hover{border-color:var(--nv-green-lt);color:var(--tx-0)}
.aq.on{background:rgba(205,220,56,.18);border-color:var(--nv-lime);color:var(--nv-lime)}
.cp-body{flex:1;overflow-y:auto;padding:13px}
.msg{margin-bottom:14px}
.msg .who{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;font-weight:700;color:var(--tx-3)}
.msg.u .bub{background:rgba(117,152,64,.18);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;font-size:11.5px;color:var(--tx-0)}
.msg.a .bub{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 12px;font-size:11.5px;color:var(--tx-1);line-height:1.6;box-shadow:var(--sh-hard)}
.msg.a .bub b{color:var(--tx-0)}
.msg.a .bub .hl{font-family:var(--ff-mono);color:var(--nv-lime);font-weight:500}

/* ═══════════════════ SVG CHART HELPERS ═══════════════════ */
function chart(o){
  const w=o.w||760,h=o.h||210,pl=42,pr=o.pr||10,pt=8,pb=20;
  const iw=w-pl-pr, ih=h-pt-pb;
  let all=[];o.series.forEach(s=>all=all.concat(s.data.filter(v=>v!=null)));
  if(o.band)all=all.concat(o.band.lo,o.band.hi);
  let mn=o.yMin!=null?o.yMin:Math.min(...all), mx=o.yMax!=null?o.yMax:Math.max(...all);
  const sp=(mx-mn)||1; if(o.yMin==null)mn-=sp*.10; if(o.yMax==null)mx+=sp*.10;
  const n=o.series[0].data.length;
  const X=i=>pl+(n<2?0:i*iw/(n-1)), Y=v=>pt+ih-((v-mn)/(mx-mn))*ih;
  let s='<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none">';
  const ticks=o.yTicks||5;
  for(let t=0;t<=ticks;t++){const v=mn+(mx-mn)*t/ticks,y=Y(v);
    s+='<line class="gl" x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(w-pr)+'" y2="'+y.toFixed(1)+'"/>';
    s+='<text class="axl" x="'+(pl-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+(o.yFmt?o.yFmt(v):Math.round(v))+'</text>';}
  (o.xLabels||[]).forEach(l=>{s+='<text class="axl" x="'+X(l.i)+'" y="'+(h-6)+'" text-anchor="middle">'+l.t+'</text>';
    if(l.rule)s+='<line class="gl" x1="'+X(l.i)+'" y1="'+pt+'" x2="'+X(l.i)+'" y2="'+(pt+ih)+'"/>';});
  if(o.band){let p='';o.band.hi.forEach((v,i)=>p+=(i?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1));
    for(let i=o.band.lo.length-1;i>=0;i--)p+='L'+X(i).toFixed(1)+','+Y(o.band.lo[i]).toFixed(1);
    s+='<path d="'+p+'Z" fill="'+(o.band.color||'#CDDC38')+'" opacity="'+(o.band.op||.16)+'"/>';}
  (o.zones||[]).forEach(z=>{s+='<rect x="'+X(z.a)+'" y="'+pt+'" width="'+(X(z.b)-X(z.a))+'" height="'+ih+'" fill="'+z.c+'" opacity="'+(z.op||.13)+'"/>';
    if(z.t)s+='<text class="axl" x="'+((X(z.a)+X(z.b))/2)+'" y="'+(pt+11)+'" text-anchor="middle" fill="'+z.c+'" style="font-size:8px;letter-spacing:.08em">'+z.t+'</text>';});
  o.series.forEach(se=>{
    if(se.type==='bar'){const bw=Math.max(2,iw/n*.62);
      se.data.forEach((v,i)=>{if(v==null||v===0)return;const y0=Y(Math.max(0,mn)),y1=Y(v);
        s+='<rect x="'+(X(i)-bw/2).toFixed(1)+'" y="'+Math.min(y0,y1).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.abs(y1-y0).toFixed(1)+'" fill="'+se.color+'" opacity="'+(se.op||.85)+'" rx="1"/>';});
      return;}
    let p='',brk=true;
    se.data.forEach((v,i)=>{if(v==null){brk=true;return}p+=(brk?'M':'L')+X(i).toFixed(1)+','+Y(v).toFixed(1);brk=false;});
    if(se.fill)s+='<path d="'+p+'L'+X(n-1)+','+Y(Math.max(0,mn))+'L'+X(0)+','+Y(Math.max(0,mn))+'Z" fill="'+se.color+'" opacity=".13"/>';
    s+='<path d="'+p+'" fill="none" stroke="'+se.color+'" stroke-width="'+(se.w||1.9)+'"'+(se.dash?' stroke-dasharray="'+se.dash+'"':'')+' stroke-linejoin="round"/>';
    if(se.dots)se.data.forEach((v,i)=>{if(v!=null)s+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="2.1" fill="'+se.color+'"/>';});
  });
  (o.marks||[]).forEach(m=>{s+='<line x1="'+X(m.i)+'" y1="'+pt+'" x2="'+X(m.i)+'" y2="'+(pt+ih)+'" stroke="'+m.c+'" stroke-width="1.2" stroke-dasharray="3 3"/>'+
    '<text class="axl" x="'+(X(m.i)+4)+'" y="'+(pt+10)+'" fill="'+m.c+'" style="font-size:8.5px">'+m.t+'</text>';});
  (o.pts||[]).forEach(p2=>{s+='<circle cx="'+X(p2.i)+'" cy="'+Y(p2.v)+'" r="3.4" fill="'+p2.c+'" stroke="#0B100C" stroke-width="1.4"/>';
    if(p2.t)s+='<text class="axl" x="'+X(p2.i)+'" y="'+(Y(p2.v)-8)+'" text-anchor="middle" fill="'+p2.c+'" style="font-size:9px;font-weight:700">'+p2.t+'</text>';});
  return s+'</svg>';
}
function spark(d,c,w,h){
  w=w||70;h=h||26;const mn=Math.min(...d),mx=Math.max(...d),r=(mx-mn)||1;
  let p='';d.forEach((v,i)=>p+=(i?'L':'M')+(i*w/(d.length-1)).toFixed(1)+','+(h-2-((v-mn)/r)*(h-5)).toFixed(1));
  return '<svg class="spark" width="'+w+'" height="'+h+'"><path d="'+p+'L'+w+','+h+'L0,'+h+'Z" fill="'+c+'" opacity=".14"/><path d="'+p+'" fill="none" stroke="'+c+'" stroke-width="1.4"/></svg>';
}
const LEG=a=>'<div class="legend">'+a.map(x=>'<span style="color:'+x.c+'"><i class="'+(x.k||'')+'" style="'+(x.k==='dash'?'':'background:'+x.c+';')+'color:'+x.c+'"></i><span style="color:var(--tx-2)">'+x.t+'</span></span>').join('')+'</div>';

function hero(o){
  return '<div class="hero"><div><p class="kicker">'+o.kick+'</p><h1>'+o.h+'</h1><p class="tag">'+o.tag+'</p></div>'+
   '<div class="hero-r">'+(o.pills||[]).join('')+
   (o.btns?'<div style="display:flex;gap:6px;margin-top:2px">'+o.btns+'</div>':'')+'</div></div>';
}
function kpi(o){
  return '<div class="kpi '+(o.acc?'acc-'+o.acc:'')+'" data-act="audit" data-run="'+(o.run||'')+'" data-t="'+(o.k)+'">'+
    (o.sp?spark(o.sp,o.spc||'#CDDC38'):'')+
    '<p class="k">'+o.k+(o.badge?'<span class="pill '+(o.badgeC||'')+'" style="font-size:8px;padding:1px 4px">'+o.badge+'</span>':'')+'</p>'+
    '<p class="v">'+o.v+(o.u?'<small>'+o.u+'</small>':'')+'</p>'+
    '<p class="s">'+(o.s||'')+'</p></div>';
}

   '<div class="dec-meta">'+AG(d.ag)+(d.ag2?'<span class="muted tiny">+</span>'+AG(d.ag2):'')+

     '<span class="tiny muted mono">'+d.ts+'</span></div>'+

   (d.drivers?'<div class="drivers"><p class="tiny" style="margin:0 0 3px;color:var(--tx-3);letter-spacing:.11em;text-transform:uppercase;font-weight:700;font-size:8.5px">Variable importance · from the computation plane</p>'+
     d.drivers.map(x=>'<div class="dr"><span class="lbl">'+x[0]+'</span><span class="bar"><i class="'+(x[1]<0?'neg':'')+'" style="width:'+Math.abs(x[1])+'%"></i></span><span class="val">'+x[2]+'</span></div>').join('')+'</div>':'')+
   '<div class="fb"><span class="lb">Analyst decision</span>'+
     '<button class="btn sm" data-act="fb" data-id="'+d.id+'" data-v="agree">✓ Agree</button>'+
     '<button class="btn sm danger" data-act="fb" data-id="'+d.id+'" data-v="disagree">✕ Disagree</button>'+

   '<p class="fb-note" id="fbn-'+d.id+'"></p></div>';
}

  qa:{
   0:{route:['sup','mi','op'],html:'<b>Release it. Hold 2.0 MW, not 4.0.</b><br><br>The evening peak is worth more in energy than in capacity tomorrow — but not for the reason you would expect. The binding constraint is not price, it is <b>volume</b>.<br><br>DK2 procures only <span class="hl">6.1 MW</span> of FCR-N locally. A 4.0 MW bid takes two-thirds of the product; on the trailing-30-day elasticity that depresses the clearing price by an estimated <span class="hl">€2.9/MW/h</span> — you would be bidding against yourself.<ul><li>Hold <b>2.0 MW FCR-N</b> across HE00–05 and HE09–10 → <span class="hl">€515</span></li><li>Release <b>4.0 MW</b> to <b>mFRR up</b> (250 MW deep, €8.6/MW/h) → <span class="hl">€138</span></li><li>Keep the full 6 MW free for HE18–21 discharge at a P50 of <span class="hl">€161–196/MWh</span> → <span class="hl">€1,988</span> arbitrage</li></ul>Net effect of releasing rather than holding 4 MW FCR-N: <b style="color:var(--pos)">+€214</b>.<br><br>One caveat worth stating: this assumes the evening peak holds. If Nordic wind comes in high, the spread compresses and the recommendation inverts — FCR-N clears <i>higher</i> in a wind surge. Scenario S-114 has that case at −€774 on the objective.',

   3:{route:['sup','sc','op'],html:'<b>Scenario S-114. Objective falls €774, and the optimal strategy inverts.</b><br><br>+2.4 GW of Nordic wind, re-run through the same TFT artifact and the same Gurobi model:<ul><li>D+1 mean spot <span class="hl">€142.3 → €118.9</span></li><li>Evening peak HE20 <span class="hl">€196 → €139</span> (−€57)</li><li>Peak–trough spread <span class="hl">€115 → €87</span></li><li>Negative-price hours <span class="hl">0 → 2</span></li><li>FCR-N clearing <span class="hl">€18.4 → €23.1</span> — <i>up</i>, because the surge pushes thermal plant off the frequency-response stack</li></ul>The strategy flip matters more than the number. At an €87 spread, a second cycle no longer covers the <span class="hl">€112/EFC</span> degradation charge. So: <b>hold capacity, cycle once, accept €1,966</b> rather than chase the spread and pay for a second cycle.<br><br>That recommendation is at 76 % confidence and is on your queue. It is a judgement about degradation economics, not a forecast, which is exactly the kind of call I want a human on.',
     cites:[['run 8f3c·s114','Scenario S-114, TFT v4.2.1 + Gurobi 11.0.3, Δ objective −€774'],['Warranty basis','€112 per equivalent full cycle, SoC-window weighted'],['Energinet FcrNdDK2','Wind-surge elasticity on FCR-N clearing, 30-day fit']],run:'run 8f3c·s114',impact:'−€774'},
   4:{route:['sup','mi','op'],html:'<b>Midday. The classic night trough is gone in summer DK.</b><br><br>DK1/DK2 hour-of-day averages for 24–30 Aug 2026 make this unambiguous:<ul><li>Overnight HE00–HE05: <span class="hl">€128–142/MWh</span></li><li>Midday HE13–HE16: <span class="hl">€78–95/MWh</span> — HE14 is the minimum at €78.3</li><li>Evening HE20: <span class="hl">€191/MWh</span> maximum</li></ul>Solar has inverted the shape. The tradeable spread is <b>midday-charge / evening-discharge</b>, worth about €113/MWh on hourly averages that week.<br><br>Your incumbent scheduler still assumes a night trough. On D+1 alone that single assumption is worth <b style="color:var(--pos)">€788</b> — 20 MWh bought at €100 rather than €140.<br><br>Caveat: in winter the night trough reasserts itself. This is a seasonal rule, not a permanent one, and the optimiser re-derives it each day rather than hard-coding either shape.',
     cites:[['Energinet DayAheadPrices','DK1 hour-of-day means, 672 × 15-min records, 24–30 Aug 2026'],['run 8f3c·c13','MILP re-solve with shifted charge window, Δ +€788']],run:'run 8f3c·c13',impact:'+€788'},
   5:{route:['sup','mo','dq'],html:'<b>P95 downside €0.4k on D+1 — but the tail is much worse than that number suggests.</b><br><br>With 15-minute imbalance settlement and a single price, a missed activation settles at the imbalance price. August DK1 distribution:<ul><li>Mean <span class="hl">€118.87/MWh</span> — essentially the same as the spot mean of €120.16</li><li>But roughly <b>3× the dispersion</b>: P25 €27, P75 €164, P95 €245</li><li>25 intervals below zero (min <span class="hl">−€51.65</span>), 42 above €300, 11 above €500, max <span class="hl">€1,171.93</span></li></ul>And the documented historical tail is far beyond that: DK1+DK2 coupled at <span class="hl">€4,618/MWh</span> on 12 Feb 2025.<br><br>So the honest answer is two numbers, not one: <b>€0.4k at P95</b>, and a credible worst case an order of magnitude higher. I have deliberately set the confidence on that exposure figure to <span class="hl">52 %</span> — a mean-and-P95 summary of a distribution with that tail is not something to trade on without seeing the tail.',

  seed:[{r:'a',route:['sup'],html:'<b>Afternoon, Marcus.</b> ERCOT desk is loaded. Load at <span class="hl">78,400 MW</span> as of 14:42 CT; today\'s peak P50 is <span class="hl">82,600 MW</span> at HE17.<br><br>Three things:<ul><li>We are <span class="hl">2,100 MW above ERCOT\'s MTLF</span>. I can defend the gap — three of their seven models under-weight cumulative heat.</li><li><b>September 4CP is live.</b> Today\'s P50 would set the month peak, but 28 days remain and P(a hotter day) is 78 %. My recommendation is to hold, not curtail.</li><li>The Permian heat advisory was extended through Friday. Validated at 14:22, store written v13 → v14, four forecasts re-triggered.</li></ul>',
    cites:[['ERCOT NP3-565-CD','MTLF 80,500 MW at HE17, models A3/E2/M in use'],['run 5b7e·d01','TFT quantile v3.8.4, P50 82,600 MW']],run:'run 5b7e·d01'}],
  qa:{
   0:{route:['sup','mi','sg'],html:'<b>Cumulative heat. Their model sees today\'s temperature; ours sees the last three days of it.</b><br><br>Breaking the 2,100 MW down:<ul><li><b>+1,900 MW — 72-hour EWMA thermal mass.</b> Today is the fourth consecutive day above 99 °F in NORTH_C. Building mass, sustained AC duty cycles, and a higher overnight floor that a same-day dry-bulb model cannot represent. Three of ERCOT\'s seven MTLF models (A3, E2, M) are in use today and all three under-weight this.</li><li><b>+200 MW — Far West large-load ramp</b> outside ERCOT\'s officer-letter baseline. The baseline says 2,733 MW for 2026; the observed FAR_WEST/WEST ramp is running ahead of it.</li></ul>Where we agree: dew point (+2,400 MW), BTM solar offset (−1,050 MW) and the school-in-session flag are all in both models.<br><br>How confident am I? <span class="hl">88 %</span>. Our 7-day rolling MAPE is 1.84 % against their 2.71 %, and our peak-MW error is ±640 MW against their ±1,980 MW. But ERCOT\'s own reported MTLF day-ahead MAPE has historically run 2.4–2.9 %, and published vendor comparisons land at 1.98–2.33 % — so 1.84 % is a credible edge, not a claim of magic.',
     cites:[['ERCOT NP3-565-CD','7-day forecast by model and weather zone, in-use flag'],['ASOS/AWOS','46 stations, 72 h temperature history, population-weighted'],['ERCOT CDR Dec 2025','TSP officer-letter loads 2,733 MW (2026) → 28,223 MW (2030)'],['run 5b7e·d01','TFT quantile v3.8.4, driver decomposition, SHA-256 9c14be07…f0b3']],run:'run 5b7e·d01',impact:'+2,100 MW'},
   1:{route:['sup','sc','mo'],html:'<b>Scenario S-207. Peak goes to 89,650 MW and you should publish P90, not P50.</b><br><br>At the fitted <span class="hl">1,410 MW/°F</span> sensitivity in the 95–105 °F band:<ul><li>Peak P50 <span class="hl">82,600 → 89,650 MW</span></li><li>Peak P90 <span class="hl">85,140 → 92,400 MW</span> — that is <b>above the all-time record</b> of 91,134 MW</li><li>Distance to record narrows from 8,534 MW to <span class="hl">1,484 MW</span></li><li>Net-load peak <span class="hl">68,900 → 75,100 MW</span></li><li>PRC at peak <span class="hl">7,240 → 4,180 MW</span> — inside the €20/MWh ORDC adder floor territory (RTOLCAP ≤ 6,500 MW)</li><li>September 4CP probability <span class="hl">22 % → 71 %</span></li></ul>The recommendation to publish P90 is deliberate, and it needs your name on it. When the cost of under-forecasting is an ORDC adder and an emergency notice, and the cost of over-forecasting is carrying reserves you do not use, the asymmetry justifies moving off the central estimate. That is a judgement call, not a forecast.<br><br>One number to keep in view: on 22 July 2026 ERCOT set the 91,134 MW record and real-time still cleared at only <span class="hl">$378/MWh</span> — 12.7 GW more peak solar and ~8 GW more evening battery discharge than August 2024. Record load no longer implies record price.',
     cites:[['run 5b7e·s207','Scenario S-207 +5 °F, TFT quantile v3.8.4'],['Fitted response','1,410 MW/°F, 95–105 °F band — MODELLED, no ERCOT-published figure'],['ERCOT 2024 ORDC biennial report','HCAP $5,000/MWh, adder floor $20 at RTOLCAP ≤ 6,500 MW'],['ERCOT all-time records','91,134 MW, 22 Jul 2026; RT peak $378/MWh']],run:'run 5b7e·s207',impact:'+7,050 MW'},
   2:{route:['sup','op','mi'],html:'<b>No. Hold, and arm the alert at 65 %.</b><br><br>Today\'s P50 of 82,600 MW <i>would</i> set the September 4CP — the month peak to date is 79,410 MW from 01 September. But:<ul><li><b>28 days remain</b> in the month</li><li>Our seasonal model puts <b>P(a hotter September day) at 78 %</b></li><li>So P(today is the month peak) is only <span class="hl">22 %</span></li></ul>Curtailing now spends response budget on an interval that is four-to-one against being the one that matters. Expected value says wait.<br><br>What I would do instead: arm the curtailment alert at a <b>65 % threshold</b> and re-evaluate each afternoon. The most likely interval today is <span class="hl">17:45–18:00 CT</span> — note that 4CP timing has been drifting later as solar and storage reshape the afternoon.<br><br>Confidence <span class="hl">74 %</span>. The soft part is the seasonal decay estimate (−1.1 °F/week climatological), which is doing a lot of work in that 78 %.<br><br>Worth remembering that wholesale storage load is excluded from the 4CP calculation — that exclusion is what moved the June 2024 peak to a Sunday.',
     cites:[['ERCOT 4CP','Highest 15-min interval in each of Jun/Jul/Aug/Sep; WSL excluded'],['run 5b7e·4cp','Monte Carlo 50k paths, P(month peak today) 22 %'],['ERCOT summer 2026','Expected 4CP load response ~4,300 MW; 2025 observed max 1,501 MW'],['Transmission cost basis','≈ $67/kW-yr (2023), 30–40 % of a commercial bill']],run:'run 5b7e·4cp',impact:'defers ≈$410k'},
   3:{route:['sup','sg','mo'],html:'<b>Oilfield electrification, and our own model was 3.1 % light on it.</b><br><br>FAR_WEST at HE11 came in <span class="hl">−3.1 %</span> against P50 — above our ±2.5 % tolerance, so Monitor opened a causal review at 14:36.<br><br>What the review found:<ul><li>The Permian heat advisory had been <b>extended through Friday</b>, which our 72-hour EWMA had not yet absorbed</li><li>FAR_WEST is structurally the hardest zone: thin load (~9 % of system), oilfield electrification, and the fastest large-load growth in ERCOT at <span class="hl">+11.4 % YoY</span></li><li>Its standing MAPE is <span class="hl">3.9 %</span> against a system 1.84 % — roughly 2× the system error, which is normal for a small zone</li></ul>The advisory link was classified as <b>thermal-mass persistence</b>, validated at 14:22, and the FAR_WEST driver weight went up 6 %. Store v13 → v14, four forecasts re-triggered.<br><br>There is a second, unresolved thread: the observed FAR_WEST/WEST ramp is running ahead of ERCOT\'s officer-letter baseline. The candidate explanation is under-reporting, at <span class="hl">63 %</span> confidence. That is on your queue as an escalation, not a store write — 63 % is not enough to change a model on.',
     cites:[['NWS Midland','Permian Basin heat advisory extended through 04 Sep'],['ERCOT NP6-345-CD','FAR_WEST actual vs forecast, HE11'],['ERCOT large-load queue','226 GW, 77 % data centres (Nov 2025)'],['run 5b7e·sig4','Signal classification, store v13 → v14']],run:'run 5b7e·sig4'},
   4:{route:['sup','mo','sc'],html:'<b>3.2 % MAPE against ERCOT\'s 11.3 %. And the reason is not a better weather model.</b><br><br>26 January 2026, Winter Storm Fern:<ul><li>ERCOT forecast <span class="hl">84,500 MW</span></li><li>Actual peak <span class="hl">75,922 MW</span> (instantaneous, morning)</li><li>Over-forecast by <span class="hl">~8,600 MW</span> — about 11 %</li></ul>The cause was not weather. It was <b>behaviour</b>: statewide school and business closures plus oil &amp; gas curtailment. A model that only knows temperature cannot see a school district deciding to close.<br><br>What we did about it: an analyst added a <b>societal-closure feature</b> to the causality store, with a Nov–Mar seasonal gate. It is versioned as v11, signed by j.okafor, and it is <b>dormant today</b> — no closure signal, schools in session, no curtailment notices, and the seasonal gate is closed. Firing it in September would cost roughly 4,000 MW of accuracy, which is why the gate exists.<br><br>That is the loop, concretely: the model was wrong once, a named analyst explained why, and the explanation is now versioned code that a regression suite tests on every model swap. S-198 replays Fern on every candidate model.',
     cites:[['ERCOT System Operations Update, Feb 2026','Winter Storm Fern, forecast vs actual'],['ERCOT Monthly January 2026','75,922 MW instantaneous peak, 26 Jan'],['Causality store v11','Societal closure → weekday load, −3,400 MW, seasonal gate Nov–Mar, j.okafor'],['run 5b7e·w26','Closure-feature gate check — dormant, correctly']],run:'run 5b7e·w26'},
   5:{route:['sup','dq','mi'],html:'<b>Seven drivers, summing to 82,600 MW at HE17.</b><ul><li><b>+61,200 MW</b> — calendar base (Wednesday, week 36), from lagged load on a 3-year same-DOW panel</li><li><b>+14,800 MW</b> — cooling response to dry bulb, 46-station population-weighted, 101 °F in NORTH_C</li><li><b>+3,150 MW</b> — large flexible load ramp, FAR_WEST + WEST officer-letter loads</li><li><b>+2,400 MW</b> — dew point / latent load, ASOS dew point 71–78 °F</li><li><b>+1,900 MW</b> — 72-hour EWMA thermal mass, fourth consecutive day above 99 °F</li><li><b>+200 MW</b> — school-in-session flag, TX ISD calendars</li><li><b>−1,050 MW</b> — behind-the-meter solar offset at the 16:00 CT sun angle</li></ul>The number to watch is not any single driver but the <b>ensemble spread</b>: ±1.8 °F across HRRR, GFS, NBM and ECMWF at today\'s 1,410 MW/°F sensitivity is <span class="hl">±2,540 MW</span> — most of our P10–P90 width. <b>Weather uncertainty dominates model uncertainty.</b> Narrowing the band means better weather inputs, not a bigger network.<br><br>One label to keep straight: the 1,410 MW/°F sensitivity is <b>our fitted response</b>. ERCOT publishes no MW/°F figure, so it appears as MODELLED everywhere in this desk, including here.',
     cites:[['ASOS/AWOS METAR','46 ERCOT stations, population-weighted, dry bulb and dew point'],['NOAA/NWS HRRR 14:00Z, GFS 12Z, NBM 13Z','Ensemble spread ±1.8 °F at peak hour'],['ERCOT Load Forecasting Overview','MTLF weather variables: dry bulb, dew point, cloud, wind, heat index, wet bulb'],['run 5b7e·d01','Driver decomposition, TFT quantile v3.8.4']],run:'run 5b7e·d01'}}}

let THREAD=[];
function msgHTML(m){
  if(m.r==='u')return '<div class="msg u"><div class="who">'+P.ini+' · '+P.role.split('—')[0].trim()+'</div><div class="bub">'+m.html+'</div></div>';
  return '<div class="msg a"><div class="who">Astrea · supervisor</div><div class="bub">'
   +(m.route?'<div class="route">'+m.route.map(k=>AG(k)).join('<span class="arw">→</span>')+'</div>':'')
   +m.html
   +(m.cites?'<div class="cites"><div class="ttl">Sources · every number traceable</div>'
      +m.cites.map((c,i)=>'<div class="cite"><span>['+(i+1)+']</span><span>'+c[0]+' — '+c[1]+'</span></div>').join('')+'</div>':'')
   +'<div class="msg-foot">'
     +(m.impact?'<span class="pill ok">$-IMPACT '+m.impact+'</span>':'')
     +(m.run?'<span class="runid" data-act="audit" data-run="'+m.run+'" data-t="Chat answer lineage">'+m.run+' ↗</span>':'')
     +'<span style="flex:1"></span>'
     +'<button class="btn sm" data-act="fb" data-id="chat'+(m.i||0)+'" data-v="agree">✓</button>'
     +'<button class="btn sm danger" data-act="fb" data-id="chat'+(m.i||0)+'" data-v="disagree">✕</button>'
     +'<button class="btn sm" data-act="fb" data-id="chat'+(m.i||0)+'" data-v="correct">✎ Correct</button>'
   +'</div><p class="fb-note" id="fbn-chat'+(m.i||0)+'"></p></div></div>';
}
function renderChat(){
  $('#cpBody').innerHTML=THREAD.map(msgHTML).join('');
  $('#cpBody').scrollTop=$('#cpBody').scrollHeight;
}

  $('#cpChips').innerHTML=CHATS[P.id].chips.map((c,i)=>'<button class="chip" data-act="ask" data-i="'+i+'">'+c+'</button>').join('');
}

   +Object.entries(AGENTS).map(([k,a])=>'<button class="aq '+(AGSEL===k?'on':'')+'" data-act="agq" data-k="'+k+'">'+a.n+'</button>').join('');
}
let chatN=0;
function ask(i){
  const c=CHATS[P.id];
  THREAD.push({r:'u',html:c.chips[i]});renderChat();

/* ═══════════════════ FEEDBACK MODAL ═══════════════════ */
const FBMETA={
 agree:{t:'Agree with this decision',b:'Confirm & sign off',
   codes:['Reasoning is sound and the drivers match my own read',
          'Numbers reconcile with the source data I checked',
          'Consistent with how I would have called it',
          'Conservative in the right direction']},
 disagree:{t:'Disagree with this decision',b:'Reject & penalise router',
   codes:['Proposed causal link is not supported by the data',
          'Driver weighting is wrong for these conditions',
          'Missing a driver the model does not have',
          'Right direction, wrong magnitude',
          'Over-fitted to a small number of tail events',
          'Market rule or product definition applied incorrectly']},
 correct:{t:'Correct a value',b:'Apply correction & re-trigger',
   codes:['Measured value differs from the modelled one',
          'Source data has since been revised',
          'Unit or timezone error',
          'Volume / capacity figure is stale',
          'Confidence is overstated for this distribution']},
 causal:{t:'Add or confirm a causal link',b:'Write to store & re-trigger',
   codes:['Confirmed — link is real and correctly signed',
          'Confirmed with a narrower scope than proposed',
          'New link, not currently in the store',
          'Reclassify into a different causal category']}
};
let FBCTX={id:null,v:null};
function openFB(id,v){
  FBCTX={id,v};const m=FBMETA[v];
  $('#mdTitle').textContent=m.t;
  $('#mdSubmit').textContent=m.b;
  $('#mdBody').innerHTML=
   '<div class="field"><label>Reason code · this is the training signal</label><div class="radios">'
   +m.codes.map((c,i)=>'<label><input type="radio" name="rc" '+(i===0?'checked':'')+'><span>'+c+'</span></label>').join('')
   +'</div></div>'
   +(v==='correct'?'<div class="c2"><div class="field"><label>Model value</label><input value="'+(P.id==='trader'?'18.4 EUR/MW/h':'82,600 MW')+'" readonly></div>'
     +'<div class="field"><label>Your value</label><input placeholder="'+(P.id==='trader'?'e.g. 17.1':'e.g. 83,400')+'"></div></div>':'')
   +(v==='causal'?'<div class="c2"><div class="field"><label>Driver</label><input value="'+(P.id==='trader'?'Nordic unit outage':'Heat advisory extension')+'"></div>'
     +'<div class="field"><label>Target</label><input value="'+(P.id==='trader'?'FCR-N clearing price':'FAR_WEST thermal mass')+'"></div></div>'
     +'<div class="field"><label>Scope limit (optional)</label><input placeholder="e.g. only when ENTSO-E A80 shows a matching outage"></div>':'')
   +'<div class="field"><label>Note for the audit trail</label><textarea placeholder="Why — in your own words. This is stored against the run_id and is visible to anyone auditing the decision."></textarea></div>'
   +'<div class="card" style="background:rgba(205,220,56,.06);border-color:rgba(205,220,56,.35);padding:11px">'
   +'<p class="kicker">What happens when you submit</p>'
   +'<p class="tiny" style="margin:6px 0 0;line-height:1.7">'
   +(v==='agree'?'The decision is signed off against your name and the run_id. It becomes positive training signal for the router and the bid/forecast proceeds.'
    :v==='disagree'?'The decision is blocked. The router is penalised so it stops proposing this class of explanation under these conditions. Nothing is written to the causality store.'
    :v==='correct'?'The corrected value replaces the modelled one, the causality store is versioned, and every affected downstream forecast re-triggers automatically.'
    :'The link is written to the causality store as a new version, previous version retained. Affected forecasts re-trigger and the change is visible in the run register.')
   +'</p></div>';
  $('#modal').classList.add('on');$('#scrim').classList.add('on');
}
function submitFB(){
  const note=$('#fbn-'+FBCTX.id);
  const v=FBCTX.v;
  const msgs={
   agree:'✓ <b>Signed off</b> — recorded against '+(P.id==='trader'?'s.lindqvist':'m.whitfield')+' and the run_id. Positive training signal logged; decision proceeds.',
   disagree:'✕ <b>Rejected</b> — router penalised for this explanation class. No causality-store write. Decision blocked pending a revised proposal.',
   correct:'✎ <b>Correction applied</b> — causality store v14 → v15. '+(P.id==='trader'?'3':'4')+' downstream forecasts re-triggered; new run_ids issued.',
   causal:'⚡ <b>Causal link written</b> — store v14 → v15, previous version retained. '+(P.id==='trader'?'3':'4')+' affected forecasts re-triggering now.'};
  if(note){note.innerHTML=msgs[v];note.classList.add('show');
    note.style.color=v==='disagree'?'var(--neg)':'var(--pos)';
    note.style.borderLeftColor=v==='disagree'?'var(--neg)':'var(--pos)';
    note.style.background=v==='disagree'?'rgba(229,105,94,.1)':'rgba(171,202,71,.1)';}
  closeAll();
  toast(msgs[v].replace(/<[^>]+>/g,''));
  if(v!=='agree'){const c=$('#rfCaus');if(c)c.textContent='v15';}
}
function closeAll(){$('#drawer').classList.remove('on');$('#modal').classList.remove('on');$('#scrim').classList.remove('on');}
let tmr;
function toast(t){const el=$('#toast');el.innerHTML=t;el.classList.add('on');clearTimeout(tmr);tmr=setTimeout(()=>el.classList.remove('on'),4200);}

function wrapTables(root){
  $$('table.tbl',root).forEach(t=>{
    if(t.parentElement&&t.parentElement.classList.contains('tblwrap'))return;
    const w=document.createElement('div');w.className='tblwrap';
    t.parentNode.insertBefore(w,t);w.appendChild(t);
  });
}
function go(s){
  if(!SCREENS[s])return;
  SCR=s;renderNav();
  const c=$('#canvas');c.innerHTML=SCREENS[s]();wrapTables(c);c.scrollTop=0;
}
function setProfile(id){
  P=PROFILES[id];SCR=P.home;AGSEL='sup';chatN=0;
  THREAD=CHATS[P.id].seed.slice();
  renderTop();renderTape();renderAgentQuick();renderChips();renderChat();go(P.home);
  $('#rfCaus').textContent='v14';
  toast('Profile switched to <b>'+P.role+'</b> — screens, markets, agents, data sources and the copilot thread all reload for this desk.');
}

/* clock */
setInterval(()=>{const d=new Date();
  let h=14,m=42,s=(d.getSeconds());
  $('#clkT').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');},1000);

/* ═══════════════════ EVENTS ═══════════════════ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el)return;
  const a=el.dataset.act;
  if(a==='go'){go(el.dataset.s);}
  else if(a==='audit'){openAudit(el.dataset.run,el.dataset.t);}
  else if(a==='fb'){openFB(el.dataset.id,el.dataset.v);}
  else if(a==='ask'){ask(+el.dataset.i);}
  else if(a==='agq'){AGSEL=el.dataset.k;renderAgentQuick();$('#selAgent').value=AGSEL;
    toast('Routing pinned to <b>'+AGENTS[AGSEL].n+'</b> — the Supervisor will hand this thread straight to that specialist instead of auto-routing.');}
  else if(a==='refresh'){toast('<b>Parallel pull complete</b> — '+(P.id==='trader'?'8 sources in 20,972 ms: Energinet · eSett · regelleistung · ENTSO-E · Open-Meteo · NVE · Fingrid · Google News.':'10 sources in 1,842 ms: ERCOT MIS · Public API · HRRR · GFS · NBM · 46 ASOS stations · AMI · SCADA · officer letters · news RSS.'));}
  else if(a==='submitbids'){toast('<b>Blocked — analyst sign-off required.</b> Two decisions on this bid stack are unsigned. Shadow deployment carries no write access to Nord Pool or Energinet by design.');}
  else if(a==='runscen'){toast('<b>Re-running all agents</b> under the perturbed input vector. New run_id issued; the base forecast is never overwritten.');}
  else if(a==='signall'){toast('<b>Sign-off recorded</b> for all decisions marked Agree. Positive training signal logged against '+(P.id==='trader'?'s.lindqvist':'m.whitfield')+'.');}
  else if(a==='notify4cp'){toast('<b>Curtailment alert armed</b> at a 65 % month-peak threshold. You will be paged when the 15-minute probability crosses it.');}
});
$('#drClose').onclick=closeAll;$('#mdClose').onclick=closeAll;$('#mdCancel').onclick=closeAll;$('#scrim').onclick=closeAll;
$('#mdSubmit').onclick=submitFB;
$('#cpWide').onclick=()=>$('#copilot').classList.toggle('wide');
$('#cpClear').onclick=()=>{THREAD=CHATS[P.id].seed.slice();chatN=0;renderChat();toast('New thread. Desk context (profile, market, causality store v14) is carried over from Memory Palace L2.');};
$('#cpSend').onclick=()=>{const v=$('#cpInput').value.trim();if(!v)return;$('#cpInput').value='';askFree(v);};
$('#cpInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#cpSend').click();}});
$('#selProfile').onchange=e=>setProfile(e.target.value);

$('#selHorizon').onchange=e=>{toast('Forecast horizon → <b>'+e.target.value+'</b>. '+(P.id==='trader'?'The optimiser re-solves over the new window.':'MTLF/STLF/IHLF products swap accordingly.'));go(SCR);};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll();});

/* boot */
setProfile('trader');
